<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'"><title>喵言喵语 · 设置</title><link rel="stylesheet" href="settings.css"></head><body><header><p>GEMINI STAR / COMPANION</p><h1>让陪伴恰到好处。</h1><span id="source">正在读取状态……</span></header><main>
<section><h2>外观与位置</h2><label>角色大小 <input id="scale" type="range" min="140" max="360" step="10"><output id="scale-value"></output></label><label><span>仅在 Antigravity 窗口内显示</span><input id="hostWindowOnly" type="checkbox"></label><p class="hint">原生绑定宿主窗口，随宿主层级与最小化状态变化；关闭后恢复桌面位置。</p><label><span>始终置顶</span><input id="alwaysOnTop" type="checkbox"></label><label><span>贴近边缘时吸附</span><input id="snap" type="checkbox"></label><label><span>减少动态</span><input id="reducedMotion" type="checkbox"></label><label><span>鼠标穿透</span><input id="clickThrough" type="checkbox"></label><p class="hint">Ctrl+Alt+G 唤回；Ctrl+Alt+Shift+G 关闭穿透。</p></section>
<section><h2>气泡与用量</h2><label><span>显示气泡</span><input id="bubbleOn" type="checkbox"></label><label><span>新模型步骤的用量提示</span><input id="turnCostOn" type="checkbox"></label><label>提示停留<select id="turnCostDurationMs"><option value="3000">3 秒</option><option value="5000">5 秒</option><option value="10000">10 秒</option><option value="0">直到主动收起</option></select></label><p class="hint">只统计本机日志中的模型步骤。真实额度、余额及费用没有来源时显示 —。</p></section>
<section><h2>猫娘彩蛋</h2><label><span>偶尔得意或委屈一下</span><input id="easterEggs" type="checkbox"></label><button id="preview-reaction">看看表情</button><p class="hint">仅空闲时低频出现，不打断思考与用量提示。喵言喵语在第二页，点击挂件切换下一句。</p></section><section><h2>原声音效</h2><label><span>启用音效</span><input id="sound" type="checkbox"></label><label>音色<select id="soundSet"></select></label><label>音量<input id="volume" type="range" min="0" max="100"><output id="volume-value"></output></label><div class="actions"><button id="audition">试听一组</button><span id="audio-note">默认静音</span></div></section>
<section><h2>手动额度记录</h2><label><span>显示手动记录</span><input id="manualQuota" type="checkbox"></label><label>5 小时剩余 %<input id="manualPercent" type="number" min="0" max="100" step="1"></label><label>1 周剩余 %<input id="manualWeeklyPercent" type="number" min="0" max="100" step="1"></label><p class="hint">可自行填写 Gemini Models 两个周期的剩余比例，气泡明确标记“手动记录”。不会当作服务端读取结果。</p></section>
<footer><button id="dock-left">左下角</button><button id="dock-right">右下角</button><button id="reset">重置位置</button><button id="quota-refresh">读取宿主额度</button><button id="refresh">重新扫描日志</button><button id="undo" title="恢复本次打开面板前的设置">撤回本次调整</button><span id="saved" role="status"></span></footer></main><script src="settings.cjs"></script></body></html>
